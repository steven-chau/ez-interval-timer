<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="description" content="Interval timer for workouts, stretching, and timed routines">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <title>EZ Interval Timer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- ===== Config View ===== -->
    <div id="config-view" class="view">
      <button id="btn-menu" class="btn-hamburger" aria-label="Menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>

      <div id="menu-backdrop" class="menu-backdrop closed"></div>
      <div id="menu-drawer" class="menu-drawer closed">
        <div class="menu-header">
          <h2>Menu</h2>
          <button id="btn-menu-close" class="btn-menu-close" aria-label="Close menu">&times;</button>
        </div>
        <div class="menu-items">
          <button id="btn-add-to-homescreen" class="menu-item">Add to Home Screen</button>
          <a href="https://github.com/steven-chau/ez-interval-timer" target="_blank" rel="noopener" class="menu-item">GitHub Repo</a>
          <a href="https://github.com/steven-chau/ez-interval-timer/issues" target="_blank" rel="noopener" class="menu-item">Contact</a>
        </div>
      </div>

      <header class="config-header">
        <h1>EZ Interval Timer</h1>
      </header>

      <main class="config-main">
        <!-- Quickstart Panel -->
        <section class="panel quickstart-panel">
          <h2>Quickstart</h2>

          <div class="config-row">
            <label>Sets</label>
            <div class="stepper">
              <button class="stepper-btn" data-action="decrement" data-target="sets" aria-label="Decrease sets">&#8722;</button>
              <span class="stepper-value" id="sets-display">3</span>
              <button class="stepper-btn" data-action="increment" data-target="sets" aria-label="Increase sets">+</button>
            </div>
          </div>

          <div class="config-row">
            <label>Work</label>
            <div class="time-stepper">
              <button class="stepper-btn" data-action="decrement" data-target="work" aria-label="Decrease work time">&#8722;</button>
              <div class="time-display" data-target="work" role="button" tabindex="0" aria-label="Work duration: 0 minutes 30 seconds">
                <span class="time-min" id="work-min-display">0</span><span class="time-sep">:</span><span class="time-sec" id="work-sec-display">30</span>
              </div>
              <button class="stepper-btn" data-action="increment" data-target="work" aria-label="Increase work time">+</button>
            </div>
          </div>

          <div class="config-row">
            <label>Rest</label>
            <div class="time-stepper">
              <button class="stepper-btn" data-action="decrement" data-target="rest" aria-label="Decrease rest time">&#8722;</button>
              <div class="time-display" data-target="rest" role="button" tabindex="0" aria-label="Rest duration: 0 minutes 10 seconds">
                <span class="time-min" id="rest-min-display">0</span><span class="time-sep">:</span><span class="time-sec" id="rest-sec-display">10</span>
              </div>
              <button class="stepper-btn" data-action="increment" data-target="rest" aria-label="Increase rest time">+</button>
            </div>
          </div>

          <div class="config-row">
            <label>Get Ready</label>
            <div class="time-stepper">
              <button class="stepper-btn" data-action="decrement" data-target="prepare" aria-label="Decrease prepare time">&#8722;</button>
              <div class="time-display" data-target="prepare" role="button" tabindex="0" aria-label="Get Ready duration: 0 minutes 10 seconds">
                <span class="time-min" id="prepare-min-display">0</span><span class="time-sep">:</span><span class="time-sec" id="prepare-sec-display">10</span>
              </div>
              <button class="stepper-btn" data-action="increment" data-target="prepare" aria-label="Increase prepare time">+</button>
            </div>
          </div>

          <div class="quickstart-actions">
            <button id="btn-save-routine" class="btn btn-secondary">Save Routine</button>
            <button id="btn-start" class="btn btn-primary btn-large">Start</button>
          </div>
        </section>

        <!-- Routines Section -->
        <section class="panel routines-section">
          <div class="routines-header">
            <h2>Your Routines</h2>
            <button id="btn-add-routine" class="btn btn-icon" aria-label="Add new routine">+</button>
          </div>
          <div id="routines-grid" class="routines-grid"></div>
          <p id="routines-empty" class="routines-empty hidden">No routines yet. Use the quickstart panel above to create one.</p>
        </section>
      </main>
    </div>

    <!-- ===== Timer View ===== -->
    <div id="timer-view" class="view hidden">
      <div class="timer-bg" id="timer-bg">
        <div id="lock-overlay" class="lock-overlay hidden"></div>
        <div class="timer-content">
          <div class="phase-label" id="phase-label">PREPARE</div>

          <div class="countdown-container">
            <svg class="progress-ring" viewBox="0 0 200 200">
              <circle class="progress-ring-track" cx="100" cy="100" r="90" />
              <circle class="progress-ring-fill" cx="100" cy="100" r="90" id="progress-ring" />
            </svg>
            <div class="countdown-digits" id="countdown-digits">10</div>
          </div>

          <div class="set-counter" id="set-counter">Set 1 / 3</div>
        </div>
        <img id="finish-gif" class="finish-gif" src="img/dicaprio-meme.gif" alt="">
      </div>

      <div class="timer-controls" id="timer-controls">
        <button class="ctrl-btn" id="btn-skip-back" aria-label="Skip backward">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        </button>
        <button class="ctrl-btn ctrl-btn-play" id="btn-play-pause" aria-label="Pause">
          <svg id="icon-pause" width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="5" height="16"/><rect x="14" y="4" width="5" height="16"/></svg>
          <svg id="icon-play" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" class="hidden"><polygon points="6,3 20,12 6,21"/></svg>
        </button>
        <button class="ctrl-btn" id="btn-skip-fwd" aria-label="Skip forward">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        </button>
        <button class="ctrl-btn" id="btn-lock" aria-label="Lock screen">
          <svg id="icon-unlocked" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>
          <svg id="icon-locked" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </button>
        <button class="ctrl-btn ctrl-btn-exit" id="btn-exit">Exit</button>
      </div>

    </div>
  </div>

  <!-- ===== Routine Edit Modal ===== -->
  <div id="routine-modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <h2 id="modal-title">New Routine</h2>

      <div class="modal-field">
        <label for="modal-name">Name</label>
        <input type="text" id="modal-name" maxlength="30" placeholder="Routine name" class="text-input">
      </div>

      <div class="modal-field">
        <label>Sets</label>
        <div class="stepper">
          <button class="stepper-btn" data-action="decrement" data-target="modal-sets" aria-label="Decrease sets">&#8722;</button>
          <span class="stepper-value" id="modal-sets-display">3</span>
          <button class="stepper-btn" data-action="increment" data-target="modal-sets" aria-label="Increase sets">+</button>
        </div>
      </div>

      <div class="modal-field">
        <label>Work</label>
        <div class="time-stepper">
          <button class="stepper-btn" data-action="decrement" data-target="modal-work" aria-label="Decrease work time">&#8722;</button>
          <div class="time-display" data-target="modal-work" role="button" tabindex="0">
            <span class="time-min" id="modal-work-min-display">0</span><span class="time-sep">:</span><span class="time-sec" id="modal-work-sec-display">30</span>
          </div>
          <button class="stepper-btn" data-action="increment" data-target="modal-work" aria-label="Increase work time">+</button>
        </div>
      </div>

      <div class="modal-field">
        <label>Rest</label>
        <div class="time-stepper">
          <button class="stepper-btn" data-action="decrement" data-target="modal-rest" aria-label="Decrease rest time">&#8722;</button>
          <div class="time-display" data-target="modal-rest" role="button" tabindex="0">
            <span class="time-min" id="modal-rest-min-display">0</span><span class="time-sep">:</span><span class="time-sec" id="modal-rest-sec-display">10</span>
          </div>
          <button class="stepper-btn" data-action="increment" data-target="modal-rest" aria-label="Increase rest time">+</button>
        </div>
      </div>

      <div class="modal-field">
        <label>Get Ready</label>
        <div class="time-stepper">
          <button class="stepper-btn" data-action="decrement" data-target="modal-prepare" aria-label="Decrease prepare time">&#8722;</button>
          <div class="time-display" data-target="modal-prepare" role="button" tabindex="0">
            <span class="time-min" id="modal-prepare-min-display">0</span><span class="time-sep">:</span><span class="time-sec" id="modal-prepare-sec-display">10</span>
          </div>
          <button class="stepper-btn" data-action="increment" data-target="modal-prepare" aria-label="Increase prepare time">+</button>
        </div>
      </div>

      <div class="modal-actions">
        <button id="btn-modal-cancel" class="btn btn-secondary">Cancel</button>
        <button id="btn-modal-save" class="btn btn-primary">Save</button>
      </div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/state.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/confetti.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
