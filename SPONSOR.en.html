<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sponsor — EZ Interval Timer</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --surface: #16213e;
      --text: #e0e0e0;
      --text-secondary: #a0a0b0;
      --accent: #e94560;
      --radius: 12px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 2rem 2rem 1.75rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .card h1 {
      font-size: 1.35rem;
      margin-bottom: 0.5rem;
    }
    .card p {
      color: var(--text-secondary);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .divider {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.08);
      margin: 1.25rem 0;
    }
    .method h2 {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-secondary);
      margin-bottom: 1rem;
    }
    .method img {
      max-width: 200px;
      height: auto;
      border-radius: 8px;
      margin-bottom: 0.5rem;
    }
    .method .note {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
    }
    .thanks {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-top: 1.25rem;
    }
  </style>
</head>
<body>
<div class="card">
  <h1>Sponsor This Project</h1>
  <p>EZ Interval Timer is free, ad-free, and open source. Your sponsorship helps keep it that way and supports ongoing development.</p>

  <hr class="divider">

  <div class="method">
    <h2>Crypto</h2>
    <p class="note">Scan the QR code below to send a crypto donation.</p>
    <img src="./sponsor/crypto-qr.png" alt="Crypto QR Code">
    <p class="note"><strong>Accepted:</strong> BTC, ETH, USDC (ERC-20 / Polygon)</p>
  </div>

  <p class="thanks">Thank you for your support!</p>
</div>
</body>
</html>
